\* Expected to FAIL: reproduces the Bug 10 counterexample fixed by 808bca7.
\* With LateBinding = FALSE, writers bind entity ids from their snapshot, so
\* two writers reading the same snapshot allocate the same id and both commit
\* via append. S4 catches it. MC_small checks S4 with LateBinding = TRUE.
SPECIFICATION Spec
INVARIANTS
  TypeOK
  S4_UniqueEntityIds
CONSTANTS
  Writers = {w1, w2}
  Tables = {t1, t2}
  MaxLog = 4
  MaxRetries = 3
  LateBinding = FALSE
