syntax = "proto3";
package iceberg.catalog;

option java_package = "org.apache.iceberg.catalog.proto";
option java_outer_classname = "CatalogProto";

// ============================================================
// READ FIRST: THIS FILE IS NOT COMPILED.
// ============================================================
//
// `catalog.proto` is a **schema-of-record** for the on-disk wire format.
// It is written in protobuf IDL so it reviews unambiguously and tools
// can read it, but the build does NOT run `protoc` on it and there are
// no generated `CatalogProto` classes. The `option java_package` and
// `option java_outer_classname` lines above are aspirational; they only
// matter to a hypothetical future `protoc` invocation.
//
// All encoding/decoding lives in two hand-rolled Java files:
//
//   * `ProtoCodec.java`         — Checkpoint and its sub-messages
//   * `InlineDeltaCodec.java`   — TableMetadataDelta and per-update messages
//
// The catalog's Checkpoint and Intention are the payloads of a log's
// checkpoint and records, whose envelope (the log id, record ids and the
// committed set) is intentlog-core's log.proto, written by its LogEnvelope.
//
// Both construct tags by hand (`(fieldNumber << 3) | wireType`). A reader
// generated by `protoc` from this file decodes what they write, but they
// do not write what `protoc` would: they write zero-valued fields, not
// always in field-number order (min_reader_version comes first), repeated
// numbers unpacked (but RemoveManifestDelta.parent_indices, packed), and a
// negative int32 as a 5-byte varint rather than proto3's 10-byte sign
// extension (`ProtoCodec.writeRawVarint(int)`). The
// reverse does not hold: the codecs require fields proto3 omits when zero
// (the codec tags), and read a negative int32 correctly only in the short
// form.
//
// Two tests keep this file and the codecs in step (errata T5):
//   * `CatalogProto` walks every catalog file the test suites write
//     (`CheckpointRoundTrip`) against this schema: each field must be
//     declared here, with a type of the wire type it was written with,
//     and each enum value must be declared.
//   * `TestFormatExplorer` checks the codecs' field-number constants
//     against this file in both directions, and that the explorer's
//     embedded schema and fixtures are current.
//
// Why hand-roll: we have wire-byte determinism across `protobuf-java`
// version bumps, latitude for non-proto patterns (lazy scanning,
// required fields enforced at decode), no runtime `protobuf-java`
// dependency, and no build-time `protoc` toolchain. The trade is the
// drift risk above.
//
// When editing this file:
//   1. Update the field-number constants and encode/decode logic in
//      `ProtoCodec.java` / `InlineDeltaCodec.java`.
//   2. Update `SPEC.md`, `SPEC_TM.md`, or `SPEC_ML.md` as appropriate.
//   3. Regenerate the format explorer's fixtures (see
//      docs/format-explorer/README.md); `TestFormatExplorer` fails until
//      they are current.
//
// ============================================================
// Checkpoint - written on compaction (CAS)
// ============================================================

// The catalog's state, the `state` of a log checkpoint (intentlog-core's
// log.proto LogCheckpoint), which also carries the catalog's identity (its
// log_id) and the committed transactions.
message Checkpoint {
  reserved 1, 20;                   // were catalog_uuid and committed_transactions

  // ID allocation state: replay binds a transaction's late-bound ids to
  // these, in log order (see CreateNamespace).
  int32 next_namespace_id = 2;
  int32 next_table_id = 3;

  // The reader version this checkpoint needs (ProtoCodec
  // SUPPORTED_READER_VERSION, now 1); a reader that supports less refuses it.
  int32 min_reader_version = 4;

  // The catalog's conflict encoding (ConflictEncoding): how replay decides
  // whether a table update conflicts with what landed since its writer read
  // the table. Absent until a record sets one (SetConflictEncoding), and
  // then replay judges by the Lamport clock, "lamport". A reader that does
  // not know the encoding refuses the checkpoint.
  string conflict_encoding = 5;

  // How the catalog pages its inline tables' old snapshots
  // (docs/SNAPSHOT_PAGING.md): absent until a record sets it
  // (SetSnapshotPaging), and then no snapshot is paged.
  SnapshotPaging snapshot_paging = 6;

  // Catalog contents, each in order of its key (id; namespace id and then key
  // for properties), so that a checkpoint is a function of the state (I11)
  repeated Namespace namespaces = 10;
  repeated Table tables = 11;
  repeated NamespaceProperty namespace_properties = 12;

  // Inline table metadata (tables with metadata stored in the catalog)
  repeated InlineTable inline_tables = 13;
}

// A table's snapshots are cut into blocks of `block` sequence numbers; block k
// seals once the table's last sequence number reaches (k + 1) * block +
// window (docs/SNAPSHOT_PAGING.md, "Blocks"). Fixed by the catalog's first
// record, as the conflict encoding is.
message SnapshotPaging {
  uint32 block = 1;
  uint32 window = 2;
}

// Every checkpoint holds the root namespace as a row: id 0, parent 0, empty
// name. Its version orders top-level creates and drops like any parent's.
message Namespace {
  int32 id = 1;
  int32 version = 2;
  int32 parent_id = 3;      // 0 = root
  string name = 4;          // single level name, not full path
}

message Table {
  int32 id = 1;
  int32 version = 2;
  int32 namespace_id = 3;
  string name = 4;
  string metadata_location = 5;
  // The conflict encoding's state of the table, in the encoding's own
  // layout; absent while it has none (a table it has not observed, or an
  // encoding that keeps none).
  bytes conflict_state = 6;
}

message NamespaceProperty {
  int32 namespace_id = 1;
  string key = 2;
  string value = 3;
}

// Codec used to encode the bytes of a full TableMetadata when it is stored
// inline in the catalog file (CreateTableInline.metadata, the
// UpdateTableInline.full_metadata oneof case, and InlineTable.metadata in the
// checkpoint). The codec field is required wherever such bytes appear: the
// decoder rejects a record without it, 0 included. CODEC_JSON_GZIP is
// Iceberg's TableMetadataParser.Codec.GZIP. CODEC_STRUCTURAL is the
// structural columnar layout described in docs/TM_ENCODING_BENCH_RESULTS.md;
// it is gzip-wrapped too, and the first varint after gunzip is the layout's
// own version (StructuralInlineMetadataCodec.FORMAT_VERSION, now 2), so the
// layout can evolve without proto churn.
enum InlineMetadataCodec {
  CODEC_JSON_GZIP   = 0;
  CODEC_STRUCTURAL  = 1;
}

message InlineTable {
  int32  id                   = 1;
  int32  version              = 2;
  int32  namespace_id         = 3;
  string name                 = 4;
  bytes  metadata             = 5;  // encoded TableMetadata bytes; see metadata_codec
  // The table's metadata directory when it went inline (its
  // write.metadata.path, or its location's metadata folder): the dictionary
  // entry its manifests' names are under (ManifestFileEntry).
  string manifest_prefix      = 6;
  // The table's pooled manifests, each once, in the order of their ordinals
  // (pool_ordinals).
  repeated ManifestFileEntry manifest_pool       = 7;
  // Each snapshot's manifest list, whole or as a change of its parent's, a
  // parent's before its children's (SnapshotManifestRefs).
  repeated SnapshotManifestRefs snapshot_refs    = 8;
  InlineMetadataCodec metadata_codec             = 9;  // codec for `metadata`
  bytes  conflict_state                          = 10; // as Table.conflict_state
  // The ordinal the table's next newly pooled manifest takes: a pooled
  // manifest's ordinal is assigned once, when the table first pools it, so a
  // new manifest renumbers nothing (SNAPSHOT_PAGING.md "Lists").
  uint32 next_ordinal                            = 11;
  // The ordinal of each manifest_pool entry, in its order.
  repeated uint32 pool_ordinals                  = 12;
  // The table's sealed snapshot blocks, by block (docs/SNAPSHOT_PAGING.md):
  // their snapshots are in pages, not in `metadata`, nor their lists in
  // snapshot_refs, nor the entries only they name in manifest_pool.
  repeated SealedBlock sealed_blocks             = 13;
}

// A sealed block of a table's snapshots as the root keeps it: its page is
// snap.<table id>.<table_version>.<block>.<digest hex> in the log's page store.
message SealedBlock {
  uint64 block                = 1;   // k: sequence numbers [k * B, (k + 1) * B)
  bytes  digest               = 2;   // the page's: SHA-256, truncated to 16 bytes
  bytes  merkle_root          = 3;   // of its snapshots' leaves, in order
  repeated fixed64 live_ids   = 4;   // its snapshots that have not expired, ascending
  uint32 leaves               = 5;   // how many it sealed: the leaves under merkle_root
  uint32 table_version        = 6;   // the table's at the record that sealed it
}

// A sealed snapshot an inline update brings back inline before it applies
// (a ref moved onto it): replay checks it against the root, never reading the
// page, and the update does not apply ("sealed: ...") unless it proves the
// snapshot is in its block, live (docs/SNAPSHOT_PAGING.md, "Bringing a sealed
// snapshot back").
message BroughtBack {
  fixed64 snapshot_id         = 1;
  uint64  block               = 2;
  uint32  index               = 3;   // its place among the block's leaves
  // Its canonical encoding: a snapshot block of it alone (1), its list's
  // length (2) and entries (3), if it had an inline list
  bytes   leaf                = 4;
  repeated bytes proof        = 5;   // sibling hashes, bottom up
}

// A sealed block's page: written once, before the root that names it, and
// never changed. A function of the block's snapshots, lists and entries, so
// every compactor that seals it writes the same bytes under the same name.
message SnapshotPage {
  int32  min_reader_version   = 1;   // SnapshotPages.READER_VERSION, now 1
  string table_uuid           = 2;
  int32  table_id             = 3;
  uint64 block                = 4;
  // StructuralInlineMetadataCodec's snapshot block of them, gzipped, in the
  // table's order
  bytes  snapshots            = 5;
  // The entries their lists name, each once, in the order first named
  repeated ManifestFileEntry pool = 6;
  // Each inline list, whole or as a change of its parent's in the page, by
  // index in `pool`, in the page's order
  repeated SnapshotManifestRefs lists = 7;
  // The table's version at the record that sealed it: a table that leaves
  // inline storage and comes back seals its blocks under new names, so a page
  // dropped once is garbage for good
  uint32 table_version        = 8;
}

// ============================================================
// Transaction Log - appended atomically
// ============================================================

// A transaction's actions, the `intention` of a log record (intentlog-core's
// log.proto LogRecord), which also carries the transaction's id.
message Intention {
  reserved 1, 2;                    // were transaction_id and `sealed`
  repeated Action actions = 3;
}

message Action {
  oneof action {
    CreateNamespace create_namespace = 1;
    DropNamespace drop_namespace = 2;
    SetNamespaceProperty set_namespace_property = 3;
    RemoveNamespaceProperty remove_namespace_property = 4;
    CreateTable create_table = 5;
    DropTable drop_table = 6;
    UpdateTableLocation update_table_location = 7;
    ReadTable read_table = 8;       // pins a table version the transaction read
    UpdateTableInline  update_table_inline  = 9;
    CreateTableInline  create_table_inline  = 10;
    RenameTable        rename_table         = 11;
    SetConflictEncoding set_conflict_encoding = 12;
    SetSnapshotPaging  set_snapshot_paging  = 13;
  }
}

// ============================================================
// Action types - version fields enable conflict detection
// ============================================================

// A transaction names the namespaces and tables it creates by late-bound
// (negative) ids: -1, -2, ... for namespaces and, separately, for tables, in
// the order of their creates. Replay binds
// each to the replaying state's next id when it applies the create, so every
// reader assigns the same ids and two writers of one snapshot cannot claim
// one id. Later actions of the same transaction may name a late-bound id;
// a record that names one before its create is rejected. A `*_version` of
// -1 means the entity is late-bound, so there is no version to check.

message CreateNamespace {
  int32 id = 1;                     // late-bound (negative); 0, the root, is rejected
  int32 version = 2;                // the new namespace's version (1)
  int32 parent_id = 3;              // 0 = root; negative if created in this transaction
  int32 parent_version = 4;         // must match; -1 if the parent is late-bound
  string name = 5;
}

message DropNamespace {
  int32 id = 1;
  int32 version = 2;                // must match for commit
}

message SetNamespaceProperty {
  int32 namespace_id = 1;
  int32 namespace_version = 2;      // -1 if namespace created in same txn
  string key = 3;
  string value = 4;
}

message RemoveNamespaceProperty {
  int32 namespace_id = 1;
  int32 namespace_version = 2;
  string key = 3;
}

message CreateTable {
  int32 id = 1;                     // late-bound (negative)
  int32 version = 2;                // the new table's version (1)
  int32 namespace_id = 3;           // negative if created in this transaction
  int32 namespace_version = 4;      // must match; -1 if the namespace is late-bound
  string name = 5;
  string metadata_location = 6;
}

message DropTable {
  int32 id = 1;
  int32 version = 2;
}

message UpdateTableLocation {
  int32 id = 1;
  int32 version = 2;                // must match current
  string metadata_location = 3;
}

message ReadTable {
  int32 id = 1;
  int32 version = 2;                // version that was read
}

// Moves a table to a new name, in its namespace or another. Apply bumps the
// version of the table and of both namespaces.
message RenameTable {
  int32  id                    = 1;
  int32  version               = 2;   // must match
  int32  new_namespace_id      = 3;   // negative if created in this transaction
  int32  new_namespace_version = 4;   // must match; -1 if late-bound
  string new_name              = 5;
}

// Sets the catalog's conflict encoding: the first record of a catalog
// carries it (LogCatalog.initialize). It applies only to a catalog with no
// encoding that has never had a table, so a record judged under one
// encoding is never judged under another (S2). A reader that does not know
// the encoding fails the read.
message SetConflictEncoding {
  string name = 1;
}

// Sets the catalog's snapshot paging (Checkpoint.snapshot_paging). Applies
// only to a catalog that has no paging and has never had a table, as
// SetConflictEncoding.
message SetSnapshotPaging {
  SnapshotPaging paging = 1;
}

// ============================================================
// Inline table metadata actions
// ============================================================

message CreateTableInline {
  int32  id                = 1;   // late-bound (negative)
  int32  version           = 2;   // the new table's version (1)
  int32  namespace_id      = 3;   // negative if created in this transaction
  int32  namespace_version = 4;   // must match; -1 if late-bound
  string name              = 5;
  bytes  metadata          = 6;   // encoded TableMetadata bytes; see metadata_codec
  InlineMetadataCodec metadata_codec = 7;  // codec for `metadata`
  // Optional: the manifest lists of the inline-ML snapshots a create
  // transaction commits with the table, as manifest updates only (each
  // snapshot's list as a delta on its parent's; errata D9). Applied with
  // the metadata.
  TableMetadataDelta delta = 8;
}

message UpdateTableInline {
  int32 id      = 1;
  int32 version = 2;              // must match current

  oneof payload {
    TableMetadataDelta delta = 3;   // structured metadata changes
    bytes  full_metadata     = 4;   // encoded TableMetadata; see full_metadata_codec
    string metadata_location = 5;   // pointer fallback (eviction)
  }
  // Codec for `full_metadata`. Only meaningful when the oneof is set to
  // full_metadata; ignored otherwise.
  InlineMetadataCodec full_metadata_codec = 6;
  // Optional, with full_metadata only: manifest updates for the lists of
  // the inline-ML snapshots the commit adds, and of any inline snapshot the
  // table holds no list for (Bug 62), so they land with the metadata.
  TableMetadataDelta ml_delta = 7;
  // True when the update applies only on the version it names, whatever
  // the catalog's conflict encoding: a table a catalog transaction writes,
  // which must be at the version the transaction first read (errata D12),
  // or an update Iceberg commits once (a schema or spec update, a ref
  // change through manageSnapshots).
  // Absent: a delta may apply on a later version if the encoding admits it
  // there, finalized where it lands (SPEC_TM.md "Late-bound fields").
  bool pinned = 8;
  // With head_only: the ids of the snapshots of the version the update read
  // that it drops.
  repeated int64 removed_snapshot_ids = 9;
  // With full_metadata on an inline table: full_metadata holds the table's
  // head with only the snapshots the version it read lacks, and the ones its
  // refs target. Replay keeps that version's other snapshots, minus
  // removed_snapshot_ids, in their order, and appends the new ones
  // (SNAPSHOT_PAGING.md step 1), never building the whole table from the
  // record. Absent, full_metadata holds the whole table (as on a pointer
  // table returning to inline storage), which replaces the table's.
  bool head_only = 10;
  // Sealed snapshots it brings back inline first, each with its proof
  repeated BroughtBack brought_back = 11;
  // With full_metadata on a pointer table (re-inlining), the blocks of its
  // history its writer put as import pages before sending it: replay installs
  // them as sealed, on the writer's word, and reads no page
  // (SNAPSHOT_PAGING.md, "Re-inlining")
  repeated SealedBlock imported_blocks = 12;
}

// ============================================================
// Table metadata delta types
// ============================================================

message TableMetadataDelta {
  repeated TableMetadataUpdate updates = 1;
  // Required: the committed metadata's last-updated-ms, which replay sets
  // (Iceberg no longer derives it from a snapshot's timestamp), no earlier
  // than the last-updated-ms of a later version it lands on. A new
  // snapshot's timestamp is relative to it.
  int64 last_updated_ms = 2;
  // The base the writer computed the delta on: its last sequence number,
  // and its next row id (v3). Replay moves the sequence numbers and row ids
  // the delta's snapshots assigned by how far the table it lands on has
  // moved past them (SPEC_TM.md "Late-bound fields"). Absent in a delta of
  // manifest updates only (CreateTableInline.delta, UpdateTableInline.ml_delta).
  int64 base_last_sequence_number = 3;
  int64 base_next_row_id = 4;
  // The CRC-32 of the manifest prefix of the table the writer read, when a
  // manifest it adds is named under it: replay resolves the names under the
  // prefix of the table where the record lands, which must be the same (a
  // table that left inline storage and returned may have another).
  fixed32 manifest_prefix_digest = 5;
}

message TableMetadataUpdate {
  oneof update {
    AddSnapshot             add_snapshot              = 1;
    SetSnapshotRef          set_snapshot_ref          = 2;
    RemoveSnapshots         remove_snapshots          = 3;
    AddSchema               add_schema                = 4;
    SetCurrentSchema        set_current_schema        = 5;
    AddPartitionSpec        add_partition_spec         = 6;
    SetDefaultPartitionSpec set_default_partition_spec = 7;
    AddSortOrder            add_sort_order             = 8;
    SetDefaultSortOrder     set_default_sort_order     = 9;
    SetTableProperties      set_properties            = 10;
    SetTableLocation        set_table_location        = 11;
    AddManifestDelta        add_manifest              = 12;
    RemoveManifestDelta     remove_manifest           = 13;
    RemoveSchemas           remove_schemas            = 14;
    RemovePartitionSpecs    remove_partition_specs    = 15;
  }
}

// A snapshot id a delta's update leaves out (AddManifestDelta,
// RemoveManifestDelta and SetSnapshotRef's snapshot_id) is the delta's only
// new snapshot: a delta that adds none or several states every one.
message AddManifestDelta {
  fixed64            snapshot_id = 1;
  ManifestFileEntry  manifest    = 2;
  // Optional: the manifest's index in the snapshot's list, which replay builds
  // from the parent's, less the removed manifests, inserting the added ones at
  // their positions in order. Absent: appended.
  int32              position    = 3;
}

// Manifests the new snapshot snapshot_id removes from the list it builds on,
// named by path or by index. parent_indices are indices in its parent's
// list: the list of the snapshot its AddSnapshot names as parent, which the
// writer read inline (not one its delta adds), in ascending order. Replay
// takes the paths there from the parent's list where the record lands (a
// snapshot's list never changes), and a record whose parent the table no
// longer has a list for does not apply there (SPEC_ML.md).
message RemoveManifestDelta {
  fixed64 snapshot_id             = 1;  // absent: the delta's only new snapshot
  string manifest_path_suffix     = 2;
  repeated uint32 parent_indices  = 3;
}

message AddSnapshot {
  fixed64        snapshot_id            = 1;
  string         manifest_list          = 2;   // its manifest list's path, whole; empty: inline
  CompactSummary summary                = 3;
  // The snapshot's timestamp less the delta's last_updated_ms.
  sint64         timestamp_delta_ms     = 4;
  // Present, 0 included, unless it is the base's current schema, which replay
  // uses when it is absent.
  int32          schema_id              = 5;
  // Present for a v3+ snapshot, 0 included (a snapshot that adds no rows);
  // absent for a snapshot without row lineage.
  int64          added_rows             = 6;
  // The snapshot's parent; absent for a snapshot without one (a table's
  // first, or a replace transaction's). Replay never infers it from the
  // base's current snapshot, which is wrong for staged, branch and
  // cherry-picked snapshots and for replaces.
  fixed64        parent_snapshot_id     = 7;
  // Optional: v3+ row lineage starting row ID for this snapshot.
  int64          first_row_id           = 8;
  // Optional: encryption key ID carried on the snapshot.
  string         key_id                 = 9;
  // Optional: what the producer's commit depends on beyond what it
  // writes, which an inline snapshot's producer says (Iceberg's
  // SnapshotProducer.footprint). Absent: not known, and a conflict
  // encoding that needs it coarsens.
  CommitFootprint footprint             = 10;
}

message CommitFootprint {
  FootprintKind  kind   = 1;
  // A VALIDATED commit's checks, in its producer's order: what its retry
  // would check of the commits since its parent.
  repeated FootprintCheck checks = 2;
}

// BLIND: the commit validates nothing and writes only new manifests (a fast
// or merge append); its retry commits on any version of its branch.
// VALIDATED: its retry checks only its checks (an overwrite, a row delta, a
// rewrite, a delete, a dynamic partition overwrite). OPAQUE: anything else.
// A kind a reader does not know (UNSPECIFIED included) reads as no footprint.
enum FootprintKind {
  FOOTPRINT_KIND_UNSPECIFIED = 0;
  BLIND                      = 1;
  OPAQUE                     = 2;
  VALIDATED                  = 3;
}

// That no commit since added data files, added delete files, or removed data
// files in a scope: a row filter, partitions, or (neither) every file. A
// check of a kind a reader does not know makes its footprint OPAQUE.
message FootprintCheck {
  CheckKind      kind       = 1;
  // The row filter, as Iceberg's expression JSON (ExpressionParser).
  string         filter     = 2;
  // Partitions; present, if empty, for a scope of none.
  PartitionScope partitions = 3;
}

enum CheckKind {
  CHECK_KIND_UNSPECIFIED = 0;
  NO_DATA_ADDED          = 1;
  NO_DELETES_ADDED       = 2;
  NO_DATA_REMOVED        = 3;
}

message PartitionScope {
  repeated PartitionTuple tuples = 1;
}

// A partition: its spec, and each field's value in Iceberg's single-value
// serialization (as a manifest's partition summaries bound it).
message PartitionTuple {
  int32          spec_id = 1;
  repeated PartitionValue values = 2;
}

// Absent value: null.
message PartitionValue {
  bytes          value = 1;
}

enum OperationType {
  APPEND    = 0;
  OVERWRITE = 1;
  DELETE    = 2;
  REPLACE   = 3;
}

// A count is present whenever the summary has it, 0 included. An entry the
// typed fields cannot hold exactly goes in extra.
message CompactSummary {
  OperationType      operation                     = 1;
  int64              added_data_files              = 2;
  int64              added_records                 = 3;
  int64              added_files_size              = 4;
  int64              total_data_files              = 5;
  int64              total_records                 = 6;
  int64              total_files_size              = 7;
  int64              added_delete_files            = 8;
  int64              total_delete_files            = 9;
  int64              total_equality_deletes        = 10;
  int64              total_position_deletes        = 11;
  int64              changed_partition_count       = 12;
  int64              deleted_data_files            = 13;
  int64              deleted_records               = 14;
  map<string,string> extra                         = 15;
  int64              removed_files_size            = 16;
  int64              manifests_created             = 17;
  int64              manifests_replaced            = 18;
  int64              manifests_kept                = 19;
  int64              entries_processed             = 20;
  int64              removed_delete_files          = 21;
  int64              added_position_deletes        = 22;
  int64              removed_position_deletes      = 23;
  int64              added_equality_deletes        = 24;
  int64              removed_equality_deletes      = 25;
  int64              added_position_delete_files   = 26;
  int64              removed_position_delete_files = 27;
  int64              added_equality_delete_files   = 28;
  int64              removed_equality_delete_files = 29;
  int64              added_dvs                     = 30;
  int64              removed_dvs                   = 31;
  // In an AddSnapshot of a delta (TableMetadataDelta): the summary also has
  // the extra entries of its parent's summary (the entries of it these
  // typed fields would not hold), less those named in dropped_extra and
  // those extra sets. Its parent is the snapshot AddSnapshot names, which
  // the writer read: replay takes them from the parent where the record
  // lands, and a record whose parent the table no longer has does not apply
  // there (SPEC_TM.md "Summaries"). Iceberg's iceberg-version and the
  // engine's entries are the same in every snapshot a writer makes.
  bool               inherits_parent_extra         = 32;
  repeated string    dropped_extra                 = 33;
}

message SetSnapshotRef {
  string ref_name               = 1;
  fixed64 snapshot_id           = 2;  // absent: the delta's only new snapshot
  string ref_type               = 3;
  int32  min_snapshots_to_keep  = 4;
  int64  max_snapshot_age_ms    = 5;
  int64  max_ref_age_ms         = 6;
}

message RemoveSnapshots {
  repeated int64 snapshot_ids = 1 [packed = false];
}

// Schemas and partition specs no snapshot reaches any more, which
// expireSnapshots().cleanExpiredMetadata(true) removes.
message RemoveSchemas {
  repeated int32 schema_ids = 1 [packed = false];
}

message RemovePartitionSpecs {
  repeated int32 spec_ids = 1 [packed = false];
}

message AddSchema {
  int32 schema_id      = 1;
  int32 last_column_id = 2;
  bytes schema_json    = 3;
}

message SetCurrentSchema {
  int32 schema_id = 1;
}

message AddPartitionSpec {
  int32 spec_id           = 1;
  int32 last_partition_id = 2;
  bytes spec_json         = 3;
}

message SetDefaultPartitionSpec {
  int32 spec_id = 1;
}

message AddSortOrder {
  int32 order_id           = 1;
  repeated SortField fields = 2;
}

// Sort field. Encoded structurally (no JSON on the wire) because the
// transform vocabulary is small and closed. The encoder fails if the
// SortField's Transform.toString() doesn't match the grammar below, so
// silent data loss on Iceberg-side grammar evolution is impossible.
//
// The three enums each carry an explicit *_UNSPECIFIED = 0 sentinel so the
// decoder can distinguish "missing on wire" from "valid value" — proto3's
// zero-value omission would otherwise let a malformed message decode as a
// default value. The decoder rejects UNSPECIFIED.
message SortField {
  int32 source_id            = 1;
  TransformKind kind         = 2;
  int32 transform_param      = 3;  // bucket N or truncate N; absent for non-parameterized
  SortDirection direction    = 4;
  NullOrderKind null_order   = 5;
}

enum TransformKind {
  TRANSFORM_KIND_UNSPECIFIED = 0;
  IDENTITY                   = 1;
  YEAR                       = 2;
  MONTH                      = 3;
  DAY                        = 4;
  HOUR                       = 5;
  BUCKET                     = 6;   // requires transform_param
  TRUNCATE                   = 7;   // requires transform_param
  VOID                       = 8;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  ASC                        = 1;
  DESC                       = 2;
}

enum NullOrderKind {
  NULL_ORDER_UNSPECIFIED = 0;
  NULLS_FIRST            = 1;
  NULLS_LAST             = 2;
}

message SetDefaultSortOrder {
  int32 order_id = 1;
}

message SetTableProperties {
  map<string,string> updated = 1;
  repeated string    removed = 2;
}

message SetTableLocation {
  string location = 1;
}

// ============================================================
// Manifest list inline support
// ============================================================

// A manifest: its path whole (manifest_path), or a name SnapshotProducer
// made (<commit UUID>-m<N>.avro) under its table's manifest prefix
// (InlineTable.manifest_prefix) as manifest_uuid and manifest_number.
message ManifestFileEntry {
  string manifest_path          = 1;
  int64  manifest_length        = 2;
  int32  partition_spec_id      = 3;
  int32  content                = 4;   // 0=data, 1=deletes
  int64  sequence_number        = 5;
  int64  min_sequence_number    = 6;
  // Absent: the manifest has none, but in an AddManifestDelta, where it is
  // the delta update's snapshot (no_added_snapshot_id says it has none).
  fixed64 added_snapshot_id     = 7;
  int32  added_files_count      = 8;
  int32  existing_files_count   = 9;
  int32  deleted_files_count    = 10;
  int64  added_rows_count       = 11;
  int64  existing_rows_count    = 12;
  int64  deleted_rows_count     = 13;
  repeated PartitionFieldSummaryEntry partitions = 14;
  bytes  key_metadata           = 15;
  // Present whenever the manifest has one, 0 included (a v3 table's first data
  // manifest); absent for a manifest whose rows have no ids yet.
  int64  first_row_id           = 16;
  // True when the manifest has no partition summaries (null, as in a v1
  // manifest); absent for a list, which may be empty (an unpartitioned spec).
  bool   no_partitions          = 17;
  // In an AddManifestDelta: true when the manifest has no added snapshot id.
  bool   no_added_snapshot_id   = 18;
  bytes  manifest_uuid          = 19;  // 16 bytes
  int64  manifest_number        = 20;
}

message PartitionFieldSummaryEntry {
  bool  contains_null = 1;
  bool  contains_nan  = 2;
  bytes lower_bound   = 3;
  bytes upper_bound   = 4;
}

message SnapshotManifestRefs {
  fixed64         snapshot_id = 1;
  // A whole list: its manifests' ordinals, in the list's order.
  repeated uint32 ordinals    = 2;
  // A list as a change of another (its parent's): the entry `base` places
  // before this one in snapshot_refs, less its manifests at `removed` (its
  // positions, ascending), with manifests inserted by `added`: pairs of a
  // position in this list and an ordinal, by ascending position. A whole list
  // starts every chain of 64. Absent (0): the list is whole.
  uint32          base        = 3;
  repeated uint32 removed     = 4;
  repeated uint32 added       = 5;
}
