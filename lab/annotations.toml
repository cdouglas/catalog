# What the raw results cannot say about themselves; applied by `lab ingest`, edited by hand or
# with `lab annotate`. Selectors: a run_id glob, "path:<glob>" (path under the project root),
# "source:<name>", or "where:<SQL over runs_raw>".

# [campaigns.example]
# title = "What this group of runs answers"
# select = ["example-*"]

# [[annotate]]
# select = "path:results/superseded-*"
# mark = "superseded"          # superseded | excluded | canonical | none
# note = "why"
# tags = ["tag"]

[campaigns.pilot]
select = ["pilot-mix-*", "pilot-fa-*"]
[[annotate]]
select = "where:label = 'pilot-mix' AND started_at < TIMESTAMP '2026-10-27 05:45:00'"
mark = "superseded"
note = "runtime applied to fast appends too (per-kind runtimes since)"

[campaigns.c1-fa-scaling]
title = "Fast appends as writers scale, per encoding, on s3x (append) and s3 (CAS only)"
select = ["c1-fa-scaling-*"]

[campaigns.c2-mixes]
title = "Fast appends with validated overwrites, compactions, property sets, and WAP branches"
select = ["c2-mixes-*"]

[campaigns.c3-partitions]
title = "Partitions per operation and their skew, for the partition judges"
select = ["c3-partitions-*"]

[campaigns.c4-knobs]
title = "max.append.count: CAS on every commit, 100, 1000"
select = ["c4-knobs-*"]

[campaigns.c5-tables]
title = "Tables on one catalog object"
select = ["c5-tables-*"]

[campaigns.c6-openloop]
title = "Open load at endive's arrival rates, and endive's predictions for it"
select = ["c6-openloop-*", "source:endive"]

[[annotate]]
select = ["c1-fa-scaling-5483b5ea1a71/20261027T065040Z", "c1-fa-scaling-362491b9b86e/20261027T065204Z"]
mark = "excluded"
note = "two runs (repetitions 0 and 1) started in the same second and wrote one directory; their ops interleave (fixed: a run's directory names its repetition)"

[campaigns.c2r-expiry]
title = "c2's compaction and overwrite mixes keeping 30 s of history, so expiry fails no job"
select = ["c2r-expiry-*"]

[campaigns.c7-backoff]
title = "The commit loop's backoff after a lost race: none, 20 ms, 100 ms"
select = ["c7-backoff-*"]

[campaigns.i1-ingest]
title = "Ingest without storage: a captured log replayed by one thread, by rate, committed set and batch"
select = ["i1-ingest-*"]

[campaigns.i2-compaction]
title = "Ingest with a compaction every 100 records: what the checkpoint costs and how it grows"
select = ["i2-compaction-*"]

[campaigns.i3-committed]
title = "Ingest after the committed set's build became O(added) (2db98d7): kept at steady state, and discarded"
select = ["i3-committed-*"]

[campaigns.i4-compaction]
title = "i2's compactions after the O(added) build: the set kept, at steady state, and discarded"
select = ["i4-compaction-*"]

[campaigns.i5-fold]
title = "i3's loads after replay stopped copying untouched tables and encodes skip the JSON re-parse"
select = ["i5-fold-*"]

[campaigns.i6-compaction]
title = "i4's compactions after the same changes, and gzip at its fastest level"
select = ["i6-compaction-*"]

[campaigns.i7-retention]
title = "i6's steady-state compactions at the committed set's new default retention, 30 minutes"
select = ["i7-retention-*"]

[campaigns.i8-shapes]
title = "Ingest of seven workload shapes' logs: cap-i1's, one table, skewed tables, fast appends only, eager merges, YCSB-like and four-table catalog transactions"
select = ["i8-shapes-*"]

[[annotate]]
select = ["i8-shapes-2779642ff8da/*", "i8-shapes-1ca9bda95d85/*"]
note = "capture cap-s-fast: 3 of its 16 writers died of OutOfMemoryError at 240 s (one 3 GB heap for 16 writers' InlineSnapshot lists, which fast appends grow without bound); the log is real records, from 13 writers after 240 s"

[campaigns.i9-format]
title = "i8-shapes' seven workloads captured anew in the record format of 2026-10-29: removals by index in the parent's list, summaries that keep their parent's entries"
select = ["i9-format-*"]

[[annotate]]
select = "where:label = 'i9-format' AND git_sha LIKE 'dd84699%'"
mark = "superseded"
note = "replay resolved a summary's parent entries three times per snapshot (fold ~12% slower); rerun on a8bde7b with the same captures"

[campaigns.c8-fold]
title = "c1's fast appends on the code before (4e65a65) and after (56facd8) replay folds a read onto a replica"
select = ["c8-fold-*"]

# p6 (2026-10-27, fileio-catalog 8636dda, 16-CPU shards) reran every campaign on the code merged:
# manifest-window by default, the backoff after a lost race, runs that cannot share a directory.
[[annotate]]
select = "where:git_sha LIKE '2afeb46%' AND regexp_matches(label, '^c[1-6]-')"
mark = "superseded"
note = "p5: 4-CPU shards (CPU-bound at 16+ writers), no backoff after a lost race; rerun as p6 at 8636dda"
